<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 480" role="img" aria-label="Schematic boxes showing minimum IoU point two or point one under mode-gated motion tolerance"><style>text{font-family:Inter,Arial,sans-serif}</style><text x="45" y="43" font-size="28" font-weight="800" fill="#10203A" text-anchor="start">More camera movement may allow less box overlap</text><rect x="75" y="95" width="625" height="320" rx="18" fill="#F1F5F9" stroke="#94A3B8" stroke-width="3"></rect><text x="390" y="145" font-size="28" font-weight="800" fill="#94A3B8" text-anchor="middle">Cold or clean</text><rect x="245" y="180" width="150" height="145" rx="4" fill="none" stroke="#52637B" stroke-width="5"></rect><rect x="345" y="180" width="150" height="145" rx="4" fill="none" stroke="#94A3B8" stroke-width="5"></rect><text x="390" y="365" font-size="25" font-weight="800" fill="#94A3B8" text-anchor="middle">m = 0.80 · minimum IoU = 0.20</text><rect x="785" y="95" width="625" height="320" rx="18" fill="#E7F8F5" stroke="#0D9488" stroke-width="3"></rect><text x="1100" y="145" font-size="28" font-weight="800" fill="#0D9488" text-anchor="middle">Noisy, motion ratio 2</text><rect x="955" y="180" width="150" height="145" rx="4" fill="none" stroke="#52637B" stroke-width="5"></rect><rect x="1078" y="180" width="150" height="145" rx="4" fill="none" stroke="#0D9488" stroke-width="5"></rect><text x="1100" y="365" font-size="25" font-weight="800" fill="#0D9488" text-anchor="middle">m = 0.90 · minimum IoU = 0.10</text><text x="740" y="455" font-size="22" font-weight="700" fill="#52637B" text-anchor="middle">Boxes are a sketch of the overlap rule; the frozen host still makes the match.</text></svg>