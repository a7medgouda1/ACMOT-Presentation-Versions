<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 480" role="img" aria-label="Illustrative SCI value between entry and hold thresholds"><style>text{font-family:Inter,Arial,sans-serif}</style><text x="45" y="43" font-size="28" font-weight="800" fill="#10203A" text-anchor="start">Entering HIGH and leaving HIGH use different limits</text><line x1="150" y1="205" x2="1330" y2="205" stroke="#4F46E5" stroke-width="9"></line><line x1="655.7142857142862" y1="165" x2="655.7142857142862" y2="250" stroke="#D97706" stroke-width="5"></line><text x="655.7142857142862" y="145" font-size="23" font-weight="800" fill="#D97706" text-anchor="middle">Hold HIGH above 0.50</text><line x1="841.1428571428577" y1="165" x2="841.1428571428577" y2="250" stroke="#B91C1C" stroke-width="5"></line><text x="841.1428571428577" y="280" font-size="23" font-weight="800" fill="#B91C1C" text-anchor="middle">Enter HIGH above 0.511</text><rect x="80" y="340" width="570" height="105" rx="18" fill="#E9F8EE" stroke="#15803D" stroke-width="3"></rect><text x="102" y="387" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">SCI = 0.505 · already HIGH</text><text x="102" y="427" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">Stay HIGH for now</text><rect x="800" y="340" width="580" height="105" rx="18" fill="#FEEBEC" stroke="#B91C1C" stroke-width="3"></rect><text x="822" y="387" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">SCI = 0.505 · currently MEDIUM</text><text x="822" y="427" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">Do not enter HIGH from SCI alone</text></svg>