<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 480" role="img" aria-label="Score 0.1 0.5 and 0.9 map to approximately minus 2.2 zero and plus 2.2 logits"><style>text{font-family:Inter,Arial,sans-serif}</style><text x="45" y="43" font-size="28" font-weight="800" fill="#10203A" text-anchor="start">Logit changes spacing, not the order of boxes</text><rect x="100" y="105" width="350" height="270" rx="18" fill="#E7F8F5" stroke="#0D9488" stroke-width="3"></rect><text x="275" y="170" font-size="29" font-weight="800" fill="#10203A" text-anchor="middle">Score 0.1</text><text x="275" y="250" font-size="43" font-weight="800" fill="#0D9488" text-anchor="middle">↓</text><text x="275" y="330" font-size="29" font-weight="800" fill="#0D9488" text-anchor="middle">Logit −2.2</text><rect x="570" y="105" width="350" height="270" rx="18" fill="#E7F8F5" stroke="#0D9488" stroke-width="3"></rect><text x="745" y="170" font-size="29" font-weight="800" fill="#10203A" text-anchor="middle">Score 0.5</text><text x="745" y="250" font-size="43" font-weight="800" fill="#0D9488" text-anchor="middle">↓</text><text x="745" y="330" font-size="29" font-weight="800" fill="#0D9488" text-anchor="middle">Logit 0</text><rect x="1040" y="105" width="350" height="270" rx="18" fill="#E7F8F5" stroke="#0D9488" stroke-width="3"></rect><text x="1215" y="170" font-size="29" font-weight="800" fill="#10203A" text-anchor="middle">Score 0.9</text><text x="1215" y="250" font-size="43" font-weight="800" fill="#0D9488" text-anchor="middle">↓</text><text x="1215" y="330" font-size="29" font-weight="800" fill="#0D9488" text-anchor="middle">Logit +2.2</text><text x="740" y="448" font-size="24" font-weight="700" fill="#52637B" text-anchor="middle">Low stays low; middle stays middle; high stays high.</text></svg>