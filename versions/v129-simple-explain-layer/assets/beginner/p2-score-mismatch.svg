<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 480" role="img" aria-label="Made-up Paper 2 score-halving example: score 0.9 becomes 0.45 below tracker gate 0.7"><style>text{font-family:Inter,Arial,sans-serif}</style><text x="45" y="43" font-size="28" font-weight="800" fill="#10203A" text-anchor="start">The same useful box can fall below a fixed tracker gate</text><rect x="65" y="115" width="390" height="130" rx="18" fill="#E7F8F5" stroke="#0D9488" stroke-width="3"></rect><text x="87" y="162" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">Old detector score: 0.90</text><text x="87" y="202" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">Useful car box</text><rect x="545" y="115" width="390" height="130" rx="18" fill="#FFF6DC" stroke="#D97706" stroke-width="3"></rect><text x="567" y="162" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">New score: 0.45</text><text x="567" y="202" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">Same box; score is halved</text><rect x="1025" y="115" width="390" height="130" rx="18" fill="#FEEBEC" stroke="#B91C1C" stroke-width="3"></rect><text x="1047" y="162" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">Host gate: 0.70</text><text x="1047" y="202" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">0.45 cannot start a track</text><line x1="455" y1="180" x2="535" y2="180" stroke="#0D9488" stroke-width="6"></line><line x1="935" y1="180" x2="1015" y2="180" stroke="#0D9488" stroke-width="6"></line><rect x="280" y="315" width="920" height="110" rx="18" fill="#E7F8F5" stroke="#0D9488" stroke-width="3"></rect><text x="302" y="362" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">SCL checks whether the score scale still fits.</text><text x="302" y="402" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">If repair is needed, it adapts before the unchanged tracker runs.</text></svg>