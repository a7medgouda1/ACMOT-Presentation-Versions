<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 480" role="img" aria-label="Plain-English meanings of HOTA MOTA IDF1 false positives false negatives and ID switches"><style>text{font-family:Inter,Arial,sans-serif}</style><text x="45" y="43" font-size="28" font-weight="800" fill="#10203A" text-anchor="start">Six numbers answer six different questions</text><rect x="45" y="95" width="435" height="153" rx="18" fill="#F7F9FC" stroke="#4F46E5" stroke-width="3"></rect><text x="65" y="142" font-size="31" font-weight="800" fill="#4F46E5" text-anchor="start">HOTA</text><text x="65" y="189" font-size="20" font-weight="700" fill="#10203A" text-anchor="start">Find the objects</text><text x="65" y="216" font-size="20" font-weight="700" fill="#10203A" text-anchor="start">and keep their IDs</text><rect x="520" y="95" width="435" height="153" rx="18" fill="#F7F9FC" stroke="#4F46E5" stroke-width="3"></rect><text x="540" y="142" font-size="31" font-weight="800" fill="#4F46E5" text-anchor="start">MOTA</text><text x="540" y="189" font-size="20" font-weight="700" fill="#10203A" text-anchor="start">Fewer misses, false alarms</text><text x="540" y="216" font-size="20" font-weight="700" fill="#10203A" text-anchor="start">and ID swaps</text><rect x="995" y="95" width="435" height="153" rx="18" fill="#F7F9FC" stroke="#4F46E5" stroke-width="3"></rect><text x="1015" y="142" font-size="31" font-weight="800" fill="#4F46E5" text-anchor="start">IDF1</text><text x="1015" y="189" font-size="20" font-weight="700" fill="#10203A" text-anchor="start">Keep the same ID</text><text x="1015" y="216" font-size="20" font-weight="700" fill="#10203A" text-anchor="start">on the same object</text><rect x="45" y="278" width="435" height="153" rx="18" fill="#F7F9FC" stroke="#0D9488" stroke-width="3"></rect><text x="65" y="325" font-size="31" font-weight="800" fill="#0D9488" text-anchor="start">FP</text><text x="65" y="372" font-size="20" font-weight="700" fill="#10203A" text-anchor="start">A wrong box</text><text x="65" y="399" font-size="20" font-weight="700" fill="#10203A" text-anchor="start">with no real object</text><rect x="520" y="278" width="435" height="153" rx="18" fill="#F7F9FC" stroke="#0D9488" stroke-width="3"></rect><text x="540" y="325" font-size="31" font-weight="800" fill="#0D9488" text-anchor="start">FN</text><text x="540" y="372" font-size="20" font-weight="700" fill="#10203A" text-anchor="start">A real object</text><text x="540" y="399" font-size="20" font-weight="700" fill="#10203A" text-anchor="start">with no box</text><rect x="995" y="278" width="435" height="153" rx="18" fill="#F7F9FC" stroke="#0D9488" stroke-width="3"></rect><text x="1015" y="325" font-size="31" font-weight="800" fill="#0D9488" text-anchor="start">IDS</text><text x="1015" y="372" font-size="20" font-weight="700" fill="#10203A" text-anchor="start">One object changes</text><text x="1015" y="399" font-size="20" font-weight="700" fill="#10203A" text-anchor="start">its ID number</text></svg>