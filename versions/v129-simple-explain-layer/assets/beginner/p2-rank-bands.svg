<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 480" role="img" aria-label="Made-up percentile examples for Paper 2&#x27;s exact noisy-mode score formulas"><style>text{font-family:Inter,Arial,sans-serif}</style><text x="45" y="43" font-size="28" font-weight="800" fill="#10203A" text-anchor="start">Noisy mode gives two groups new score ranges</text><rect x="75" y="110" width="625" height="280" rx="18" fill="#FFF6DC" stroke="#D97706" stroke-width="3"></rect><text x="105" y="165" font-size="31" font-weight="800" fill="#D97706" text-anchor="start">Uncertain</text><text x="105" y="230" font-size="25" font-weight="700" fill="#10203A" text-anchor="start">0.10 to below 0.50</text><text x="105" y="290" font-size="25" font-weight="700" fill="#10203A" text-anchor="start">0.1 + 0.4 × rank</text><text x="105" y="355" font-size="27" font-weight="800" fill="#D97706" text-anchor="start">rank 0.3 → 0.22</text><rect x="785" y="110" width="625" height="280" rx="18" fill="#E7F8F5" stroke="#0D9488" stroke-width="3"></rect><text x="815" y="165" font-size="31" font-weight="800" fill="#0D9488" text-anchor="start">Confident</text><text x="815" y="230" font-size="25" font-weight="700" fill="#10203A" text-anchor="start">0.50 to below 1.00</text><text x="815" y="290" font-size="25" font-weight="700" fill="#10203A" text-anchor="start">0.5 + 0.5 × rank</text><text x="815" y="355" font-size="27" font-weight="800" fill="#0D9488" text-anchor="start">rank 0.8 → 0.90</text><text x="740" y="452" font-size="23" font-weight="700" fill="#52637B" text-anchor="middle">Order is kept; the new scores are not calibrated probabilities.</text></svg>