<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 480" role="img" aria-label="Made-up frame timeline showing the 30-frame dwell rule"><style>text{font-family:Inter,Arial,sans-serif}</style><text x="45" y="45" font-size="28" font-weight="800" fill="#10203A" text-anchor="start">A requested state can wait until 30 frames have passed</text><line x1="130" y1="195" x2="1350" y2="195" stroke="#4F46E5" stroke-width="8"></line><circle cx="130" cy="195" r="15" fill="#15803D" stroke="none" stroke-width="2"></circle><text x="130" y="145" font-size="22" font-weight="800" fill="#15803D" text-anchor="middle">Frame 1</text><text x="130" y="254" font-size="20" font-weight="700" fill="#10203A" text-anchor="middle">Start LOW</text><circle cx="374" cy="195" r="15" fill="#D97706" stroke="none" stroke-width="2"></circle><text x="374" y="145" font-size="22" font-weight="800" fill="#D97706" text-anchor="middle">Frame 11</text><text x="374" y="254" font-size="20" font-weight="700" fill="#10203A" text-anchor="middle">Want MEDIUM</text><circle cx="618" cy="195" r="15" fill="#52637B" stroke="none" stroke-width="2"></circle><text x="618" y="145" font-size="22" font-weight="800" fill="#52637B" text-anchor="middle">Frame 21</text><text x="618" y="254" font-size="20" font-weight="700" fill="#10203A" text-anchor="middle">Still wait</text><circle cx="862" cy="195" r="15" fill="#15803D" stroke="none" stroke-width="2"></circle><text x="862" y="145" font-size="22" font-weight="800" fill="#15803D" text-anchor="middle">Frame 31</text><text x="862" y="254" font-size="20" font-weight="700" fill="#10203A" text-anchor="middle">Move allowed</text><circle cx="1106" cy="195" r="15" fill="#D97706" stroke="none" stroke-width="2"></circle><text x="1106" y="145" font-size="22" font-weight="800" fill="#D97706" text-anchor="middle">Frame 41</text><text x="1106" y="254" font-size="20" font-weight="700" fill="#10203A" text-anchor="middle">Want HIGH</text><circle cx="1350" cy="195" r="15" fill="#15803D" stroke="none" stroke-width="2"></circle><text x="1350" y="145" font-size="22" font-weight="800" fill="#15803D" text-anchor="middle">Frame 61</text><text x="1350" y="254" font-size="20" font-weight="700" fill="#10203A" text-anchor="middle">Move allowed</text><rect x="220" y="335" width="1040" height="105" rx="18" fill="#F3F2FF" stroke="#4F46E5" stroke-width="3"></rect><text x="242" y="382" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">The detector and tracker still run on every frame.</text><text x="242" y="422" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">Only the controller state is held between allowed changes.</text></svg>