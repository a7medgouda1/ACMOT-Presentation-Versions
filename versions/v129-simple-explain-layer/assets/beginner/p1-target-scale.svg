<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 480" role="img" aria-label="Paper 1 SCI thresholds with a separate tiny-object guard"><style>text{font-family:Inter,Arial,sans-serif}</style><text x="45" y="45" font-size="28" font-weight="800" fill="#10203A" text-anchor="start">Read the crowd score from left to right</text><line x1="130" y1="210" x2="1350" y2="210" stroke="#4F46E5" stroke-width="10"></line><line x1="130" y1="170" x2="130" y2="255" stroke="#52637B" stroke-width="5"></line><text x="130" y="147" font-size="24" font-weight="800" fill="#52637B" text-anchor="middle">0</text><line x1="492.34" y1="170" x2="492.34" y2="255" stroke="#D97706" stroke-width="5"></line><text x="492.34" y="147" font-size="24" font-weight="800" fill="#D97706" text-anchor="middle">0.297</text><line x1="753.42" y1="170" x2="753.42" y2="255" stroke="#B91C1C" stroke-width="5"></line><text x="753.42" y="147" font-size="24" font-weight="800" fill="#B91C1C" text-anchor="middle">0.511</text><line x1="1350" y1="170" x2="1350" y2="255" stroke="#52637B" stroke-width="5"></line><text x="1350" y="147" font-size="24" font-weight="800" fill="#52637B" text-anchor="middle">1</text><rect x="70" y="290" width="400" height="115" rx="18" fill="#E9F8EE" stroke="#15803D" stroke-width="3"></rect><text x="92" y="337" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">LOW</text><text x="92" y="377" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">No higher rule is true</text><rect x="530" y="290" width="400" height="115" rx="18" fill="#FFF6DC" stroke="#D97706" stroke-width="3"></rect><text x="552" y="337" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">MEDIUM</text><text x="552" y="377" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">SCI above 0.297</text><rect x="990" y="290" width="400" height="115" rx="18" fill="#FEEBEC" stroke="#B91C1C" stroke-width="3"></rect><text x="1012" y="337" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">HIGH</text><text x="1012" y="377" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">SCI above 0.511</text><text x="740" y="458" font-size="23" font-weight="700" fill="#52637B" text-anchor="middle">Tiny share above 0.50 can request HIGH even when SCI is lower.</text></svg>