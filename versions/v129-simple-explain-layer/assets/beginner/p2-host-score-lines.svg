<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 480" role="img" aria-label="Paper 2 ByteTrack and OC-SORT score gates from host contract"><style>text{font-family:Inter,Arial,sans-serif}</style><text x="45" y="45" font-size="28" font-weight="800" fill="#10203A" text-anchor="start">A tracker only sees boxes above its score limits</text><text x="45" y="135" font-size="28" font-weight="800" fill="#10203A" text-anchor="start">ByteTrack</text><line x1="340" y1="125" x2="1310" y2="125" stroke="#0D9488" stroke-width="9"></line><circle cx="437.0" cy="125" r="13" fill="#0D9488" stroke="none" stroke-width="2"></circle><text x="437.0" y="173" font-size="18" font-weight="700" fill="#0D9488" text-anchor="middle">usable floor 0.10</text><circle cx="922.0" cy="125" r="13" fill="#0D9488" stroke="none" stroke-width="2"></circle><text x="922.0" y="98" font-size="18" font-weight="700" fill="#0D9488" text-anchor="middle">match 0.60</text><circle cx="1019.0" cy="125" r="13" fill="#0D9488" stroke="none" stroke-width="2"></circle><text x="1019.0" y="173" font-size="18" font-weight="700" fill="#0D9488" text-anchor="middle">new track 0.70</text><text x="45" y="325" font-size="28" font-weight="800" fill="#10203A" text-anchor="start">OC-SORT</text><line x1="340" y1="315" x2="1310" y2="315" stroke="#B91C1C" stroke-width="9"></line><circle cx="922.0" cy="315" r="13" fill="#B91C1C" stroke="none" stroke-width="2"></circle><text x="922.0" y="364" font-size="19" font-weight="800" fill="#B91C1C" text-anchor="middle">floor = match = new track = 0.60</text></svg>