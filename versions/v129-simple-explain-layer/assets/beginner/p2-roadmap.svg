<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 480" role="img" aria-label="Paper 2: from detector scores to the same tracker; five steps shown from left to right"><style>text{font-family:Inter,Arial,sans-serif}</style><text x="45" y="44" font-size="29" font-weight="800" fill="#10203A" text-anchor="start">Paper 2: from detector scores to the same tracker</text><rect x="45" y="132" width="250" height="225" rx="18" fill="#E7F8F5" stroke="#0D9488" stroke-width="3"></rect><circle cx="170" cy="176" r="27" fill="#0D9488" stroke="none" stroke-width="2"></circle><text x="170" y="186" font-size="25" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="170" y="248" font-size="25" font-weight="800" fill="#10203A" text-anchor="middle">Read scores</text><text x="170" y="290" font-size="20" font-weight="700" fill="#52637B" text-anchor="middle">Current boxes</text><line x1="297" y1="246" x2="331" y2="246" stroke="#0D9488" stroke-width="5"></line><polygon points="331,246 320,238 320,254" fill="#0D9488"></polygon><rect x="335" y="132" width="250" height="225" rx="18" fill="#E7F8F5" stroke="#0D9488" stroke-width="3"></rect><circle cx="460" cy="176" r="27" fill="#0D9488" stroke="none" stroke-width="2"></circle><text x="460" y="186" font-size="25" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="460" y="248" font-size="25" font-weight="800" fill="#10203A" text-anchor="middle">Look back</text><text x="460" y="290" font-size="20" font-weight="700" fill="#52637B" text-anchor="middle">Earlier 10 frames</text><line x1="587" y1="246" x2="621" y2="246" stroke="#0D9488" stroke-width="5"></line><polygon points="621,246 610,238 610,254" fill="#0D9488"></polygon><rect x="625" y="132" width="250" height="225" rx="18" fill="#E7F8F5" stroke="#0D9488" stroke-width="3"></rect><circle cx="750" cy="176" r="27" fill="#0D9488" stroke="none" stroke-width="2"></circle><text x="750" y="186" font-size="25" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="750" y="248" font-size="25" font-weight="800" fill="#10203A" text-anchor="middle">Choose mode</text><text x="750" y="290" font-size="20" font-weight="700" fill="#52637B" text-anchor="middle">Cold / clean / noisy</text><line x1="877" y1="246" x2="911" y2="246" stroke="#0D9488" stroke-width="5"></line><polygon points="911,246 900,238 900,254" fill="#0D9488"></polygon><rect x="915" y="132" width="250" height="225" rx="18" fill="#E7F8F5" stroke="#0D9488" stroke-width="3"></rect><circle cx="1040" cy="176" r="27" fill="#0D9488" stroke="none" stroke-width="2"></circle><text x="1040" y="186" font-size="25" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="1040" y="248" font-size="25" font-weight="800" fill="#10203A" text-anchor="middle">Repair if needed</text><text x="1040" y="290" font-size="20" font-weight="700" fill="#52637B" text-anchor="middle">Keep or remap</text><line x1="1167" y1="246" x2="1201" y2="246" stroke="#0D9488" stroke-width="5"></line><polygon points="1201,246 1190,238 1190,254" fill="#0D9488"></polygon><rect x="1205" y="132" width="250" height="225" rx="18" fill="#E7F8F5" stroke="#0D9488" stroke-width="3"></rect><circle cx="1330" cy="176" r="27" fill="#0D9488" stroke="none" stroke-width="2"></circle><text x="1330" y="186" font-size="25" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="1330" y="248" font-size="25" font-weight="800" fill="#10203A" text-anchor="middle">Run host</text><text x="1330" y="290" font-size="20" font-weight="700" fill="#52637B" text-anchor="middle">Original tracker</text><text x="740" y="432" font-size="24" font-weight="700" fill="#52637B" text-anchor="middle">We will see one picture, one example and then the exact rule for each step.</text></svg>