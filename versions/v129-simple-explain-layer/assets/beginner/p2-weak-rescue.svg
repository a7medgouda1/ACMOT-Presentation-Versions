<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 480" role="img" aria-label="Schematic track and weak box with Paper 2 recovery checks"><style>text{font-family:Inter,Arial,sans-serif}</style><text x="45" y="43" font-size="28" font-weight="800" fill="#10203A" text-anchor="start">A weak box can be rescued only when every check passes</text><rect x="100" y="105" width="535" height="305" rx="18" fill="#F1F5F9" stroke="#D8E1EC" stroke-width="3"></rect><rect x="215" y="175" width="200" height="155" rx="8" fill="none" stroke="#0D9488" stroke-width="6"></rect><rect x="235" y="185" width="200" height="155" rx="8" fill="none" stroke="#D97706" stroke-width="6"></rect><text x="140" y="145" font-size="24" font-weight="800" fill="#0D9488" text-anchor="start">Old track</text><text x="405" y="370" font-size="24" font-weight="800" fill="#D97706" text-anchor="start">Weak new box</text><rect x="730" y="95" width="640" height="125" rx="18" fill="#E7F8F5" stroke="#0D9488" stroke-width="3"></rect><text x="752" y="142" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">Same foreground object?</text><text x="752" y="182" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">Overlap at least 0.50; no usable box covers it</text><rect x="730" y="275" width="640" height="125" rx="18" fill="#E7F8F5" stroke="#0D9488" stroke-width="3"></rect><text x="752" y="322" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">Host would otherwise miss it?</text><text x="752" y="362" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">Raise score just above its usable floor</text></svg>