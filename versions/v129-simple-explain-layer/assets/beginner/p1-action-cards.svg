<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 480" role="img" aria-label="Paper 1 frozen action triplets, including smaller input in HIGH state"><style>text{font-family:Inter,Arial,sans-serif}</style><text x="45" y="44" font-size="28" font-weight="800" fill="#10203A" text-anchor="start">The state name describes the scene — not the image size</text><rect x="50" y="100" width="420" height="300" rx="18" fill="#E9F8EE" stroke="#15803D" stroke-width="3"></rect><text x="75" y="150" font-size="32" font-weight="800" fill="#15803D" text-anchor="start">LOW</text><text x="75" y="222" font-size="28" font-weight="700" fill="#10203A" text-anchor="start">Image size: 1536</text><text x="75" y="286" font-size="26" font-weight="700" fill="#10203A" text-anchor="start">NMS limit: 0.70</text><text x="75" y="350" font-size="24" font-weight="700" fill="#10203A" text-anchor="start">Keep-box score: 0.10</text><rect x="525" y="100" width="420" height="300" rx="18" fill="#FFF6DC" stroke="#D97706" stroke-width="3"></rect><text x="550" y="150" font-size="32" font-weight="800" fill="#D97706" text-anchor="start">MEDIUM</text><text x="550" y="222" font-size="28" font-weight="700" fill="#10203A" text-anchor="start">Image size: 1280</text><text x="550" y="286" font-size="26" font-weight="700" fill="#10203A" text-anchor="start">NMS limit: 0.45</text><text x="550" y="350" font-size="24" font-weight="700" fill="#10203A" text-anchor="start">Keep-box score: 0.40</text><rect x="1000" y="100" width="420" height="300" rx="18" fill="#FEEBEC" stroke="#B91C1C" stroke-width="3"></rect><text x="1025" y="150" font-size="32" font-weight="800" fill="#B91C1C" text-anchor="start">HIGH</text><text x="1025" y="222" font-size="28" font-weight="700" fill="#10203A" text-anchor="start">Image size: 1088</text><text x="1025" y="286" font-size="26" font-weight="700" fill="#10203A" text-anchor="start">NMS limit: 0.60</text><text x="1025" y="350" font-size="24" font-weight="700" fill="#10203A" text-anchor="start">Keep-box score: 0.40</text><text x="740" y="456" font-size="23" font-weight="700" fill="#52637B" text-anchor="middle">These three actions were selected together in the paper&#x27;s final search.</text></svg>