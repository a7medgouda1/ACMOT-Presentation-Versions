<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 480" role="img" aria-label="Made-up twenty to six track-drop example for recovery probe"><style>text{font-family:Inter,Arial,sans-serif}</style><text x="45" y="42" font-size="28" font-weight="800" fill="#10203A" text-anchor="start">A sudden drop might mean lost tracks</text><rect x="65" y="110" width="440" height="122" rx="18" fill="#F3F2FF" stroke="#4F46E5" stroke-width="3"></rect><text x="87" y="157" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">Before: 20 tracks</text><text x="87" y="197" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">Remember this recent peak</text><rect x="575" y="110" width="360" height="122" rx="18" fill="#FEEBEC" stroke="#B91C1C" stroke-width="3"></rect><text x="597" y="157" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">Now: 6 tracks</text><text x="597" y="197" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">6 is less than 8 = 40% of 20</text><rect x="1010" y="110" width="400" height="122" rx="18" fill="#FEEBEC" stroke="#B91C1C" stroke-width="3"></rect><text x="1032" y="157" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">Short HIGH request</text><text x="1032" y="197" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">Only up to 3 analysis steps</text><line x1="505" y1="171" x2="565" y2="171" stroke="#4F46E5" stroke-width="6"></line><line x1="935" y1="171" x2="1000" y2="171" stroke="#4F46E5" stroke-width="6"></line><rect x="245" y="300" width="1000" height="105" rx="18" fill="#F3F2FF" stroke="#4F46E5" stroke-width="3"></rect><text x="267" y="347" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">This is a safety check, not proof that the scene got easier.</text><text x="267" y="387" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">The 30-frame dwell rule can still delay a change.</text></svg>