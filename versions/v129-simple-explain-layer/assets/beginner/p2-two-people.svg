<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 480" role="img" aria-label="Schematic two overlapping people supported by different previous tracks"><style>text{font-family:Inter,Arial,sans-serif}</style><text x="45" y="43" font-size="28" font-weight="800" fill="#10203A" text-anchor="start">Two close people can have overlapping boxes</text><rect x="150" y="95" width="650" height="325" rx="18" fill="#F1F5F9" stroke="#D8E1EC" stroke-width="3"></rect><rect x="285" y="145" width="230" height="230" rx="8" fill="none" stroke="#0D9488" stroke-width="6"></rect><rect x="405" y="135" width="240" height="240" rx="8" fill="none" stroke="#D97706" stroke-width="6"></rect><text x="300" y="130" font-size="24" font-weight="800" fill="#0D9488" text-anchor="start">Track A</text><text x="500" y="120" font-size="24" font-weight="800" fill="#D97706" text-anchor="start">Track B</text><rect x="860" y="120" width="515" height="110" rx="18" fill="#E7F8F5" stroke="#0D9488" stroke-width="3"></rect><text x="882" y="167" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">Different old tracks?</text><text x="882" y="207" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">Keep both boxes if yes</text><rect x="860" y="275" width="515" height="110" rx="18" fill="#FEEBEC" stroke="#B91C1C" stroke-width="3"></rect><text x="882" y="322" font-size="31" font-weight="800" fill="#10203A" text-anchor="start">No second-track support?</text><text x="882" y="362" font-size="23" font-weight="600" fill="#52637B" text-anchor="start">Remove the weaker duplicate</text></svg>